services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '${APP_PORT:-8000}:8000'
        environment:
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            APP_URL: '${APP_URL}'
            APP_KEY: '${APP_KEY}'
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: '3306'
            DB_DATABASE: '${DB_DATABASE:-todoapp}'
            DB_USERNAME: '${DB_USERNAME:-todoapp}'
            DB_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE:-todoapp}'
            MYSQL_USER: '${DB_USERNAME:-todoapp}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'mysql-data:/var/lib/mysql'
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
        restart: unless-stopped

volumes:
    mysql-data:
